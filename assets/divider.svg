<svg xmlns="http://www.w3.org/2000/svg" width="800" height="4" viewBox="0 0 800 4" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#7C3AED"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="800" height="4" rx="2" fill="url(#flow)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
